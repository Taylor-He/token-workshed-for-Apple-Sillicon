[package]
name = "token_workshed_native_ui"
version = "0.1.0"
edition = "2024"

[features]
default = []
wayland-blur = ["cosmic/wayland"]

[dependencies]
cosmic = { package = "libcosmic", path = "vendor/libcosmic_59bebbd", default-features = false, features = ["winit_wgpu", "tokio", "a11y"] }
directories = "5.0.1"
objc = "0.2.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[[bin]]
name = "token-workshed-native-ui"
path = "src/main.rs"

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
panic = "abort"
strip = "symbols"
